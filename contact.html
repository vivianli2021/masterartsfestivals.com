<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — MasterArtsFestivals NASA SLI Rocketry</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      align-items: start;
      max-width: 760px;
      margin: 0 auto;
    }

    .contact-info p {
      font-size: 0.96rem;
      color: var(--ink-soft);
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .info-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 1.2rem 0;
      border-bottom: 1px solid var(--line);
    }

    .info-item:last-child { border-bottom: none; }

    .info-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .info-label {
      font-family: 'Sora', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--clay);
      margin-bottom: 0.3rem;
    }

    .info-value {
      font-size: 0.95rem;
      color: var(--ink);
    }

    @media (max-width: 768px) {
      .contact-grid { max-width: 100%; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">Master<span>Arts</span>Festivals</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="photos.html">Photos</a></li>
      <li><a href="sponsorship.html">Sponsors</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <div class="page-header subpage-header">
    <h1 class="page-title">Contact Us</h1>
  </div>

  <div class="content">

    <div class="contact-grid">

      <div class="contact-info">

        <div class="info-item">
          <div class="info-icon">📍</div>
          <div>
            <div class="info-label">Location</div>
            <div class="info-value">Orange County, United States</div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" style="width:24px;height:24px;"></div>
          <div>
            <div class="info-label">Instagram</div>
            <div class="info-value"><a href="https://www.instagram.com/masterartsfestival/?utm_source=ig_web_button_share_sheet" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">@masterartsfestivals</a></div>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon"><img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" alt="Gmail" style="width:24px;height:24px;"></div>
          <div>
            <div class="info-label">Email</div>
            <div class="info-value">masterartsfestivals@gmail.com</div>
          </div>
        </div>

      </div>

    </div>

  </div>

  <footer>
    <p><strong>MasterArtsFestivals</strong> NASA SLI Rocketry Team</p>
    <a href="login.html" class="admin-login-btn">Admin Login</a>
  </footer>

</body>
</html>

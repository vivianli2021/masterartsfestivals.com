<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Admin Login — MasterArtsFestivals Rocketry</title>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="style.css" />
	<style>
		.login-wrap {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 8.5rem 1.2rem 2.4rem;
		}

		.login-panel {
			width: min(460px, 100%);
			background: color-mix(in srgb, var(--surface) 92%, transparent);
			border: 1px solid var(--line);
			border-radius: 20px;
			box-shadow: var(--shadow);
			padding: 2rem;
		}

		.login-eyebrow {
			font-family: 'Sora', sans-serif;
			font-size: 0.64rem;
			letter-spacing: 0.2em;
			text-transform: uppercase;
			color: var(--clay);
			margin-bottom: 0.65rem;
		}

		.login-title {
			font-family: 'Sora', sans-serif;
			font-size: 1.7rem;
			line-height: 1.15;
			margin-bottom: 0.5rem;
			color: var(--ink);
		}

		.login-sub {
			color: var(--ink-soft);
			line-height: 1.7;
			font-size: 0.95rem;
			margin-bottom: 1.5rem;
		}

		.form-group { margin-bottom: 1rem; }

		.form-group label {
			display: block;
			margin-bottom: 0.45rem;
			font-family: 'Sora', sans-serif;
			text-transform: uppercase;
			letter-spacing: 0.12em;
			color: var(--ink-soft);
			font-size: 0.64rem;
		}

		.form-group input {
			width: 100%;
			background: #132129;
			border: 1px solid var(--line);
			border-radius: 12px;
			padding: 0.72rem 0.95rem;
			color: var(--ink);
			font-family: 'Manrope', sans-serif;
			font-size: 0.92rem;
			outline: none;
			transition: border-color 0.2s, box-shadow 0.2s;
		}

		.form-group input:focus {
			border-color: rgba(31,107,102,0.45);
			box-shadow: 0 0 0 3px rgba(31,107,102,0.12);
		}

		.login-actions {
			display: flex;
			flex-wrap: wrap;
			gap: 0.8rem;
			margin-top: 1.35rem;
		}

		.login-actions .btn {
			flex: 1 1 170px;
			text-align: center;
		}
	</style>
</head>
<body>

	<nav>
		<a class="nav-logo" href="index.html">Master<span>Arts</span>Festivals</a>
		<ul>
			<li><a href="about.html">About</a></li>
			<li><a href="rocket.html">Rocket</a></li>
			<li><a href="process.html">Process</a></li>
			<li><a href="contact.html">Contact</a></li>
		</ul>
	</nav>

	<main class="login-wrap">
		<section class="login-panel">
			<p class="login-eyebrow">Team Portal</p>
			<h1 class="login-title">Admin Login</h1>
			<p class="login-sub">Access internal launch logs and build notes. This page is currently a visual prototype.</p>

			<form>
				<div class="form-group">
					<label for="email">Email</label>
					<input id="email" name="email" type="email" placeholder="you@example.com" />
				</div>

				<div class="form-group">
					<label for="password">Password</label>
					<input id="password" name="password" type="password" placeholder="Enter password" />
				</div>

				<div class="login-actions">
					<button class="btn btn-primary" type="submit">Sign In</button>
					<a class="btn btn-ghost" href="index.html">Back to Site</a>
				</div>
			</form>
		</section>
	</main>

</body>
</html>
